  <!-- 4. Kritik Satır İçi CSS (Critical CSS) — İlk ekran "beyaz flash" olmadan yüklensin -->
  <style>
    /* Tarayıcı, React yüklenmeden önce bunu gösterir */
    html { background: #050507; color-scheme: dark; }
    body { margin: 0; background: #050507; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    /* Görsel yüklenirken yer tutucu — Layout Shift sıfır olsun (CLS=0) */
    img { display: block; max-width: 100%; }

    /* Skip Navigation Link (Erişilebilirlik + CLS Önleme) */
    .skip-to-main {
      position: absolute;
      top: -100%;
      left: 1rem;
      z-index: 9999;
      padding: 0.75rem 1.5rem;
      background: #a855f7;
      color: white;
      font-weight: 700;
      border-radius: 0 0 0.5rem 0.5rem;
      text-decoration: none;
      transition: top 0.2s;
    }
    .skip-to-main:focus { top: 0; }
  </style>

  <script type="application/ld+json">
