name: MahoraPeak Desktop release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and publish signed Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-app
          tagName: ${{ github.ref_name }}
          releaseName: "MahoraPeak Desktop ${{ github.ref_name }}"
          releaseBody: "MahoraPeak Desktop için imzalı Windows kurulumu ve uygulama içi güncelleme paketi."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis
