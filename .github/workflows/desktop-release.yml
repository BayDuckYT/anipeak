name: MahoraPeak Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop release tag to build (for example desktop-v1.5.6)
        required: true
        type: string
      release_version:
        description: Human-readable desktop version (for example 1.5.6)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and publish signed Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-app
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "MahoraPeak Desktop ${{ inputs.release_version || github.ref_name }}"
          releaseBody: "MahoraPeak Desktop için imzalı Windows kurulumu ve uygulama içi güncelleme paketi."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis
