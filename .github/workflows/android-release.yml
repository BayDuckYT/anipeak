name: Android release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android signing key
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mahorapeak-android.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mahorapeak-android.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android-app
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name release APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/mahorapeak-android.apk"

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          name: MahoraPeak Android ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: ${{ runner.temp }}/mahorapeak-android.apk
